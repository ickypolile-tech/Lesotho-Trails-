 < !DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations | Lesotho Trails</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f7f5f0;
            font-family: 'DM Sans', Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #25352c;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', Georgia, serif;
        }

        a {
            text-decoration: none;
        }

        .header {
            background-color: #25352c;
            color: white;
            padding: 15px 8%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            min-height: 100px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 55px;
            height: 55px;
            border: 2px solid #d6b77a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d6b77a;
            font-size: 20px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
        }

        .brand-name small {
            font-weight: normal;
            letter-spacing: 3px;
        }

        .header h1 {
            color: white;
            text-align: center;
            font-size: 27px;
            letter-spacing: 2px;
            margin: 0;
        }

        .navigation {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 5px;
        }

        .navigation a,
        .theme-button {
            color: white;
            font-size: 14px;
            padding: 9px 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .navigation a:hover,
        .navigation a.active,
        .theme-button:hover {
            background-color: #d6b77a;
            color: #25352c;
        }

        .theme-button {
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .page-hero {
            background-color: #e8e5da;
            padding: 70px 8%;
        }

        .eyebrow {
            color: #8a6c36;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .page-hero h2 {
            font-size: 52px;
            line-height: 1.2;
            margin: 15px 0;
        }

        .page-hero h2 em {
            color: #8a6c36;
        }

        .page-hero p {
            max-width: 650px;
            font-size: 16px;
        }

        .content-section {
            width: 84%;
            max-width: 1200px;
            margin: 55px auto;
        }

        .section-heading {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
        }

        .section-heading h2 {
            font-size: 38px;
            margin: 0;
        }

        .section-heading h2 em {
            color: #8a6c36;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #d5d2c9;
            border-radius: 8px;
            padding: 5px 12px;
            background-color: white;
        }

        .search-icon {
            font-size: 25px;
            color: #8a6c36;
            margin-right: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            background: transparent;
            color: #25352c;
        }

        .search-box input:focus {
            outline: none;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .filter-button {
            background-color: transparent;
            color: #25352c;
            border: 1px solid #c9c6bb;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .filter-button:hover,
        .filter-button.active {
            background-color: #25352c;
            color: white;
            border-color: #25352c;
        }

        .destination-list {
            display: flex;
            flex-direction: column;
        }

        .destination-card {
            display: grid;
            grid-template-columns: 60px 1fr 260px 30px;
            align-items: center;
            gap: 25px;
            padding: 25px 10px;
            border-top: 1px solid #dcd9cf;
            transition: 0.3s;
        }

        .destination-card:last-child {
            border-bottom: 1px solid #dcd9cf;
        }

        .destination-card:hover {
            background-color: #eeece4;
            padding-left: 18px;
            padding-right: 18px;
        }

        .number {
            color: #8a6c36;
            font-size: 18px;
            font-weight: bold;
        }

        .destination-info h3 {
            font-size: 26px;
            margin: 0 0 8px;
        }

        .destination-info p {
            color: #666;
            font-size: 15px;
            margin: 0;
        }

        .destination-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .arrow {
            color: #8a6c36;
            font-size: 25px;
            text-align: center;
        }

        .no-results {
            display: none;
            padding: 30px 10px;
            text-align: center;
            color: #666;
        }

        .footer {
            background-color: #25352c;
            color: white;
            margin-top: 60px;
            padding: 35px 8% 20px;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
            flex-wrap: wrap;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .footer-copy {
            color: #d0d5cf;
            font-size: 14px;
            margin-top: 15px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            padding-top: 15px;
        }

        .footer-links a {
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        .footer-links a:hover {
            color: #d6b77a;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            border-top: 1px solid #526055;
            margin-top: 30px;
            padding-top: 20px;
            color: #d0d5cf;
            font-size: 13px;
        }

        body.dark-mode {
            background-color: #18221c;
            color: #f7f5f0;
        }

        body.dark-mode .page-hero {
            background-color: #29382e;
        }

        body.dark-mode .destination-card {
            border-color: #465449;
        }

        body.dark-mode .destination-card:hover {
            background-color: #29382e;
        }

        body.dark-mode .destination-info p,
        body.dark-mode .no-results {
            color: #d0d5cf;
        }

        body.dark-mode .search-box {
            background-color: #25352c;
            border-color: #526055;
        }

        body.dark-mode .search-box input {
            color: white;
        }

        body.dark-mode .filter-button {
            color: white;
            border-color: #68776b;
        }

        body.dark-mode .filter-button:hover,
        body.dark-mode .filter-button.active {
            background-color: #d6b77a;
            color: #25352c;
        }

        @media (max-width: 1000px) {
            .header {
                padding: 15px 4%;
            }

            .header h1 {
                font-size: 21px;
            }

            .navigation a,
            .theme-button {
                font-size: 12px;
                padding: 8px 6px;
            }

            .content-section {
                width: 90%;
            }

            .destination-card {
                grid-template-columns: 45px 1fr 200px 25px;
                gap: 15px;
            }

            .destination-card img {
                height: 130px;
            }

            .destination-info h3 {
                font-size: 23px;
            }

            .section-heading h2 {
                font-size: 32px;
            }
        }

        @media (max-width: 700px) {
            .header {
                display: flex;
                flex-direction: column;
                justify-content: center;
                text-align: center;
                gap: 15px;
                padding: 20px;
            }

            .logo-container {
                justify-content: center;
            }

            .header h1 {
                font-size: 25px;
            }

            .navigation {
                justify-content: center;
                gap: 5px;
            }

            .navigation a,
            .theme-button {
                font-size: 13px;
                padding: 8px;
            }

            .page-hero {
                padding: 45px 7%;
            }

            .page-hero h2 {
                font-size: 38px;
            }

            .page-hero p {
                font-size: 15px;
            }

            .content-section {
                width: 92%;
                margin: 35px auto;
            }

            .section-heading {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .section-heading h2 {
                font-size: 30px;
            }

            .filter-bar {
                gap: 7px;
            }

            .filter
